name: Päivitä sähkön ja polttoöljyn hinnat

on:
  schedule:
    # Ajetaan automaattisesti joka sunnuntai klo 16:00 UTC (klo 18/19 Suomen aikaa)
    - cron: '0 16 * * 0'
  workflow_dispatch: # Mahdollistaa päivityksen käynnistämisen myös napista ("Run workflow")

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Hae repon tiedostot
        uses: actions/checkout@v4

      - name: Aseta Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aja hintojen päivitysskripti
        run: python paivita_hinnat.py

      - name: Tallenna päivitetyt hintatiedostot repoon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spot_tuntihinnat.json oljy_hinnat.json
          git diff --staged --quiet || git commit -m "Automaattinen hintadatan päivitys ($(date +'%Y-%m-%d'))"
          git push
